aid: diagonal-therapeutics
name: Diagonal Therapeutics
description: >-
  Diagonal Therapeutics is a Watertown, Massachusetts clinical-stage biotechnology
  company founded in 2022 by CEO Alex Lugovskoy in partnership with Atlas Venture,
  developing "clustering" agonist antibodies that switch broken signaling pathways
  back on rather than inhibiting them. Its DIAGONAL product engine pairs computational
  epitope filtering with experimental screening — generating roughly 200,000 candidate
  antibody sequences per target, clustering them by predicted shape, binning by receptor
  complementarity and assembling multispecific antibodies from those bins — to make
  agonist antibody discovery tractable. The lead program, DIAG723, is a first-in-class
  ALK1:BMPRII clustering agonist antibody that restores ALK1 signaling; it holds US FDA
  and EMA orphan drug designation for hereditary hemorrhagic telangiectasia (HHT) and
  entered the Phase 1/2 DIAMOND trial (NCT07623525), with a first patient dosed in July
  2026, alongside preclinical work in pulmonary arterial hypertension. The pipeline
  extends into hematology, hepatology, nephrology and cardiovascular disease. The company
  has raised roughly USD 255 million across a USD 128 million Series A (April 2024,
  co-led by BVF Partners and Atlas Venture) and an oversubscribed USD 125 million Series
  B (January 2026, co-led by Sanofi Ventures and Janus Henderson Investors). Diagonal is
  a therapeutics developer rather than a software vendor: it operates a Next.js marketing
  site backed by a Sanity CMS, and publishes no developer portal, no API documentation
  and no machine-readable API contract of any kind.
